<h2 class="text-2xl font-semibold">Tickets</h2>

<ul class="mt-4 max-w-2xl space-y-2">
  @for (ticket of tickets(); track ticket.id) {
    <li>
      <a
        [routerLink]="['/tickets', ticket.id]"
        class="flex items-center justify-between rounded border border-slate-300 px-4 py-3 hover:bg-slate-50"
      >
        <span>#{{ ticket.id }} {{ ticket.title }}</span>
        <app-status-badge [status]="ticket.status" />
      </a>
    </li>
  }
</ul>
